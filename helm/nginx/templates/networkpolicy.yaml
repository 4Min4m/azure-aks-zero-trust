{{- if .Values.networkPolicy.enabled }}
# Default-deny for this namespace, then explicit allows. This is the
# in-cluster "microsegmentation" half of Phase 1 hardening — Azure AD
# Workload Identity and Private Endpoints secure the boundary with Azure
# PaaS services; NetworkPolicy secures east-west traffic *inside* the
# cluster, which neither of those touches.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-egress-to-mysql
spec:
  podSelector:
    matchLabels:
      app: {{ include "nginx-app.name" . }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql
      ports:
        - protocol: TCP
          port: 3306
    - to: # DNS
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: {{ include "nginx-app.name" . }}
  policyTypes: ["Ingress"]
  ingress:
    - from: [] # from the internal LB / any pod in-cluster; tighten with
               # namespaceSelector/podSelector if you add more services later
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
