apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-app.name" . }}
  labels:
    {{- include "nginx-app.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "nginx-app.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
