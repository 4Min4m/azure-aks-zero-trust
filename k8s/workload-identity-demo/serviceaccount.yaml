apiVersion: v1
kind: ServiceAccount
metadata:
  name: blob-reader
  namespace: workload-identity-demo
  annotations:
    # From `terraform output workload_identity_client_id` — this is what
    # federates this ServiceAccount to the id-ztaks-blob-reader managed
    # identity (see terraform/identity.tf). No secret, no key, ever.
    azure.workload.identity/client-id: "<PASTE terraform output workload_identity_client_id HERE>"
  labels:
    azure.workload.identity/use: "true"
